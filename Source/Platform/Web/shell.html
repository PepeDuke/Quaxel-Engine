<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>@GAME@</title>
<style>
* { box-sizing:border-box } body { margin:0; background:#090c10; color:#eee; font:16px system-ui }
main { position:fixed; inset:0; display:grid; grid-template: minmax(0,1fr) / minmax(0,1fr); place-items:center }
canvas { grid-area:1/1; width:100%; height:100%; image-rendering:pixelated }
#overlay { pointer-events:none } #status { grid-area:1/1; z-index:1; padding:1em; background:#13171c }
#display { position:fixed; top:8px; right:8px; padding:5px 9px; background:#13171ce6; color:#eee; font-size:13px }
#display summary, #display select { cursor:pointer }
#display label { display:block; margin-top:8px }
</style>
<main><canvas id="scene" tabindex="0" aria-label="@GAME@"></canvas><canvas id="overlay"></canvas>
<div id="status" role="status">Loading @GAME@…</div></main>
<details id="display"><summary>Display</summary>
<label>3D resolution <select id="render-scale">
<option value="1" selected>100% (native)</option>
<option value="0.75">75%</option>
<option value="0.5">50%</option>
<option value="game">Game resolution</option>
</select></label></details>
<script src="shadows.js"></script><script src="graphics.js"></script><script src="browser.js"></script>
<script>Quaxel.launch("@GAME@");</script>
</html>
